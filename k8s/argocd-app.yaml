apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: estateai-valuation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bittush8789/mlops-house-price-prediction
    targetRevision: CICD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: estateai-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
